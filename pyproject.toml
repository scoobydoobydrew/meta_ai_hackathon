[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellproof"
version = "0.1.0"
description = "LLM-proposed rules, solver-verified: repairing a cell-signalling model under formal verification."
requires-python = ">=3.11"
dependencies = [
    "openai==3.41.0",
    "pydantic==2.14.1",
    "typer==0.27.3",
    "rich==15.0.0",
    "python-dotenv==1.2.4",
    "clingo==5.8.2",
    "z3-solver==5.3.2.0",
    "mpbn==4.4",
    "biodivine_aeon==1.4.2",
    "pyboolnet==3.0.16",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
cellproof = "cellproof.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Meta Model API and spends money (needs MODEL_API_KEY)"]
